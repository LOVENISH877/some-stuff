# Cleaned Hyprlock Config Without External Scripts

# Set variables (optional)
$wallpaper    = bats.jpg
$blur         = 2
$rounding     = 12
$font-text    = JetBrainsMono Nerd Font
$font-display = JetBrainsMono Nerd Font
$font-symbol  = JetBrainsMono Nerd Font Mono
$weight       = 2
$inner-color  = rgba(0, 0, 0, 0.5)
$border-color = rgba(255, 255, 255, 0.15)
$clock-color  = rgba(255, 255, 255, 1)
$fg0          = rgba(255, 255, 255, 1)
$fg1          = rgba(0, 0, 0, 1)
$shape-col0   = rgba(255, 255, 255, 1)
$shape-col1   = rgba(0, 0, 0, 0.25)
$text-shadow-pass  = 1
$text-shadow-boost = 0.5

# GENERAL
general {
    no_fade_in          = true
    grace               = 1
    disable_loading_bar = false
    hide_cursor         = true
    ignore_empty_input  = true
    text_trim           = true
}

# BACKGROUND
background {
    path        = $wallpaper
    blur_passes = $blur
    contrast    = 0.9
    brightness  = 0.7
    vibrancy    = 0.17
}

# INPUT FIELD
input-field {
    size        = 275, 55
    rounding    = $rounding
    outline_thickness = $weight
    outer_color       = $border-color
    dots_size         = 0.3
    dots_spacing      = 0.5
    dots_center       = true
    inner_color       = $inner-color
    font_color        = $fg0
    fade_on_empty     = false
    font_family       = $font-text
    placeholder_text  = <span>󰢏 Password</span>
    hide_input        = false
    position          = 0, -240
    halign            = center
    valign            = center
    zindex            = 10
}

# TIME (HOURS)
label {
    text        = cmd[update:1000] date +"%H"
    color       = $clock-color
    shadow_pass = 1
    font_size   = 150
    font_family = $font-display
    position    = 0, -155
    halign      = center
    valign      = top
}

# TIME (MINUTES)
label {
    text        = cmd[update:1000] date +"%M"
    color       = $clock-color
    shadow_pass = 1
    font_size   = 150
    font_family = $font-display
    position    = 0, -325
    halign      = center
    valign      = top
}

# GREETING
label {
    text        = Welcome back!
    color       = $fg0
    font_size   = 14
    font_family = $font-text
    position    = 0, -55
    halign      = center
    valign      = center
}

# DATE
label {
    text        = cmd[update:1000] date +"%A, %B %d, %Y"
    color       = $fg0
    font_size   = 12
    font_family = $font-text
    position    = 0, -95
    halign      = center
    valign      = center
}

# NETWORK STATUS (Static placeholder)
label {
    text        = Connected to Wi-Fi
    color       = $fg1
    font_size   = 12
    font_family = $font-text
    position    = 30, 30
    halign      = left
    valign      = bottom
    zindex      = 5
}

# BATTERY STATUS (Static placeholder)
label {
    text        = Battery: 100%
    color       = $fg1
    font_size   = 12
    font_family = $font-text
    position    = -30, 30
    halign      = right
    valign      = bottom
    zindex      = 5
}

# BG shapes for NETWORK
shape {
    size        = 150, 40
    color       = $shape-col0
    rounding    = $rounding
    position    = 20, 20
    halign      = left
    valign      = bottom
    zindex      = 1
}

# BG shapes for BATTERY
shape {
    size        = 90, 40
    color       = $shape-col0
    rounding    = $rounding
    position    = -20, 20
    halign      = right
    valign      = bottom
    zindex      = 1
}
