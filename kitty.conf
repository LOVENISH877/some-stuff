shell fish
fastfetch

# FONT
#font_family      JetBrainsMono Nerd Font
#bold_font        auto
#italic_font      auto

font_family       font_family JetBrainsMono Nerd Font Bold

bold_font          JetBrainsMono Nerd Font Bold
italic_font        JetBrainsMono Nerd Font Italic
bold_italic_font   JetBrainsMono Nerd Font Bold Italic
font_size        15.0



# CURSOR
cursor_shape     block
cursor_blink     on

# COLOR SCHEME (One Dark)
include kitty-themes/themes/OneDark.conf

# SCROLLBACK
scrollback_lines 10000

# WINDOW
window_padding_width 5
background_opacity 0.75
hide_window_decorations yes
enable_blur yes



# KEYBINDINGS
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# # TABS
# tab_bar_edge             bottom
# tab_bar_style            powerline
# active_tab_foreground    #282C34
# active_tab_background    #61AFEF
# inactive_tab_foreground  #ABB2BF
# inactive_tab_background  #3E4452
# tab_bar_background       #21252B

# # PERFORMANCE & BEHAVIOR
# repaint_delay            10
# input_delay              2
# sync_to_monitor          yes

# # ENABLE LIGATURES
# enable_ligatures         always

# OPTIONAL (if using blur in Hyprland)
# enable_blur            yes
# The basic colors
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

# Cursor colors
cursor                  #F5E0DC
cursor_text_color       #1E1E2E

# URL underline color when hovering with mouse
url_color               #B4BEFE

# Kitty window border colors
active_border_color     #CBA6F7
inactive_border_color   #8E95B3
bell_border_color       #EBA0AC

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

# Colors for marks (marked text in the terminal)
mark1_foreground #1E1E2E
mark1_background #87B0F9
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC

